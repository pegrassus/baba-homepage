<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d"><title id="t">Bundesamt für besondere Angelegenheiten (BAbA) – Bildmarke</title><desc id="d">Wappenschild in Petrol mit messingfarbener Innenlinie; darin acht weisse Felder um ein gedrehtes Messingfeld – der Sonderfall, der nicht ins Raster passt. Fiktive Behörde – Demonstrationsinhalt. Kein Hoheitszeichen.</desc><path id="schild" d="M88 56H424V248C424 362 348 430 256 468C164 430 88 362 88 248Z" fill="#0F4C5C"/><path id="schild-linie" d="M110 78H402V248C402 348 336 408 256 442C176 408 110 348 110 248Z" fill="none" stroke="#B08D57" stroke-width="6"/><g id="raster" fill="#FFFFFF"><rect id="feld-1" x="161" y="155" width="54" height="54" rx="7"/><rect id="feld-2" x="229" y="155" width="54" height="54" rx="7"/><rect id="feld-3" x="297" y="155" width="54" height="54" rx="7"/><rect id="feld-4" x="161" y="223" width="54" height="54" rx="7"/><rect id="feld-5" x="297" y="223" width="54" height="54" rx="7"/><rect id="feld-6" x="161" y="291" width="54" height="54" rx="7"/><rect id="feld-7" x="229" y="291" width="54" height="54" rx="7"/><rect id="feld-8" x="297" y="291" width="54" height="54" rx="7"/></g><g id="sonderfeld"><rect x="228" y="222" width="56" height="56" rx="8" fill="#B08D57" transform="rotate(15 256 250)"/></g></svg>
